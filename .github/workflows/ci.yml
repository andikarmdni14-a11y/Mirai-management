name: CI
# Setiap push dan pull request: uji unit (logika murni dan fungsi API) lalu uji E2E di Chromium (login/offline/sinkron/impor/utang/keamanan).
# Agar rilis tidak mematahkan masuk atau pencatatan, aktifkan "Require status checks" pada branch utama dan pilih job "test".
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Cek sintaks semua JavaScript
        run: |
          for f in *.js api/*.js api/*/*.js tests/*/*.js; do node --check "$f" || exit 1; done
      - name: Uji unit
        run: npm run test:unit
      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium
      - name: Uji E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
